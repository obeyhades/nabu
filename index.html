<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a855f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nabu" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Nabu – Lär dig ord</title>
    <script>
      // Sätt mörkt tema innan första ritningen (annars blinkar sidan ljust)
      try {
        var t = JSON.parse(localStorage.getItem("nabu-theme") || "{}");
        if (t.state && t.state.theme === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

  <circle cx="189" cy="256" r="10" fill="#ffffff" />
  <circle cx="347" cy="256" r="10" fill="#ffffff" />

  <!-- Näbb -->
  <path d="M256 322 L224 358 Q256 394 288 358 Z" fill="#fb923c" />

  <!-- Magfjädrar -->
